name: Retune CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint


  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test -- --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # webOS package job (runs on PR merge to main)
  package-webos:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Setup webOS CLI
        run: |
          ARES_CLI_PACKAGE="@webos-tools/cli"
          ARES_CLI_VERSION="3.1.4"
          if npm install -g "${ARES_CLI_PACKAGE}@${ARES_CLI_VERSION}"; then
            echo "webOS CLI installed successfully"
          else
            echo "WARNING: Failed to install ${ARES_CLI_PACKAGE}@${ARES_CLI_VERSION}"
            echo "Packaging step will be skipped"
          fi
      
      - name: Package for webOS
        run: |
          if command -v ares-package &> /dev/null; then
            echo "Creating IPK package for webOS TV..."
            mkdir -p ./packages
            ares-package dist/ -o ./packages/
            ls -la ./packages/
          else
            echo "Skipping packaging - webOS CLI not available"
          fi

      - name: Upload webOS package artifacts
        if: hashFiles('packages/*.ipk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: packages/*.ipk
          retention-days: 7
