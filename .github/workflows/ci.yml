name: Lineup CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify docs
        run: npm run verify:docs

  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      &node_matrix
      fail-fast: false
      matrix:
        node-version: ['22.22.1', '24.14.0']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: |
          npm run lint
          npm run lint:css


  type-check:
    name: Type Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: *node_matrix
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: *node_matrix
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        if: matrix.node-version != '24.14.0'
        run: npm test

      - name: Run tests (with coverage)
        if: matrix.node-version == '24.14.0'
        run: npm run test:coverage

      - name: Run governance tests (contracts/policy/types)
        if: matrix.node-version == '24.14.0'
        run: npm run test:contracts
      
      - name: Upload coverage
        if: matrix.node-version == '24.14.0'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build (Node 24.14.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docs, lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # webOS package job (runs on PR merge to main)
  package-webos:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Setup webOS CLI
        run: |
          ARES_CLI_PACKAGE="@webos-tools/cli"
          ARES_CLI_VERSION="3.1.4"
          if npm install -g "${ARES_CLI_PACKAGE}@${ARES_CLI_VERSION}"; then
            echo "webOS CLI installed successfully"
          else
            echo "WARNING: Failed to install ${ARES_CLI_PACKAGE}@${ARES_CLI_VERSION}"
            echo "Packaging step will be skipped"
          fi
      
      - name: Package for webOS
        run: |
          if command -v ares-package &> /dev/null; then
            echo "Creating IPK package for webOS TV..."
            mkdir -p ./packages
            ares-package dist/ -o ./packages/
            ls -la ./packages/
          else
            echo "Skipping packaging - webOS CLI not available"
          fi

      - name: Upload webOS package artifacts
        if: hashFiles('packages/*.ipk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: packages/*.ipk
          retention-days: 7
