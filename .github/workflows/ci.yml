name: Lineup CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify docs
        run: npm run verify:docs

  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      &node_matrix
      fail-fast: false
      matrix:
        node-version: ['22.22.1', '24.14.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: |
          npm run lint
          npm run lint:css

      - name: Verify maintainability
        if: matrix.node-version == '24.14.0'
        run: npm run verify:maintainability


  type-check:
    name: Type Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: *node_matrix
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: *node_matrix
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        if: matrix.node-version != '24.14.0'
        run: npm test

      - name: Run tests (with coverage)
        if: matrix.node-version == '24.14.0'
        run: npm run test:coverage

      - name: Run governance tests (contracts/policy/types)
        if: matrix.node-version == '24.14.0'
        run: npm run test:contracts

      - name: Run tool tests
        if: matrix.node-version == '24.14.0'
        run: npm run test:tools
      
      - name: Upload coverage
        if: matrix.node-version == '24.14.0'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build (Node 24.14.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docs, lint, type-check, test]
    outputs:
      candidate-digest: ${{ steps.verify-candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build lean analyzed candidate
        run: npm run build:analyze

      - name: Verify candidate bundle structure
        run: npm run verify:bundle -- --skip-build

      - name: Remove verification metadata
        run: rm dist/bundle-stats.json

      - name: Verify final release candidate
        id: verify-candidate
        run: |
          npm run verify:candidate
          echo "digest=$(node tools/verify-release-candidate.mjs --digest-only)" >> "$GITHUB_OUTPUT"
      
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-candidate
          path: dist/
          include-hidden-files: true
          retention-days: 7

  # webOS package job (runs on PR merge to main)
  package-webos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lean-candidate
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify downloaded release candidate
        run: npm run verify:candidate -- --expected-digest '${{ needs.build.outputs.candidate-digest }}'
      
      - name: Setup webOS CLI
        run: npm install -g @webos-tools/cli@3.2.5

      - name: Verify webOS CLI
        run: command -v ares-package
      
      - name: Package for webOS
        run: npm run package:webos:dist

      - name: Upload webOS package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webos-ipk
          path: packages/*.ipk
          if-no-files-found: error
          retention-days: 7

  package-tools-windows:
    name: Packaging Tools (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Windows packaging regression tests
        run: npx jest --config jest.tools.config.js --runInBand src/__tests__/tools/packageWebos.test.ts
