# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  profile: "assertive"
  review_details: true
  collapse_walkthrough: true
  in_progress_fortune: false
  poem: false
  auto_review:
    enabled: false
  path_filters:
    - "!**/.worktrees/**"
    - "!**/worktrees/**"
    - "!docs/_local/**"
    - "!docs/agentic/evals/baselines/**"
    - "!**/.agent/**"
    - "!**/.agents/skills/desloppify/**"
    - "!**/.codanna/**"
    - "!**/.fastembed_cache/**"
    - "!**/.mcp_sequential_thinking/**"
    - "!**/.DS_Store"
  path_instructions:
    - path: "AGENTS.md"
      instructions: |
        Review this file as the short agent entrypoint. Flag contradictions with docs/AGENTIC_DEV_WORKFLOW.md, docs/agentic/plan-authoring-standard.md, and repo-local skill policy. Do not request that it become a second runbook.
    - path: "docs/AGENTIC_DEV_WORKFLOW.md"
      instructions: |
        Review this file as the operational runbook. Check that it matches AGENTS.md, the tracked-vs-local artifact policy, just-in-time discovery rules, risk-triggered planning/review, and verification expectations. Flag duplicate authority, stale guidance, or process overhead that does not improve execution quality.
    - path: "docs/agentic/**"
      instructions: |
        These files are the Lineup agent-control plane. Review for contradictions, stale references, local-only leakage, mismatches with tools/verify-docs.mjs, and gaps that would encourage tech debt or AI slop. Keep eval guidance small, representative, and outcome based.
    - path: "docs/plans/**/*.md"
      instructions: |
        Review tracked implementation plans for fresh-session executability, exact verification, rollback clarity, scope control, and absence of stale absolute paths or obsolete workflow names. Flag plans that would be brittle, ambiguous, or likely to create low-quality execution.
    - path: "docs/archive/plans/**/*.md"
      instructions: |
        Treat these as historical tracked plans, not current policy. Flag stale links, bad archive references, or outdated guidance only when it can mislead current work because of broken cross-links or conflicting claims.
    - path: "docs/runs/README.md"
      instructions: |
        Review this only as tracked guidance for local-only run artifacts. Ensure it does not conflict with .gitignore or tools/verify-docs.mjs and does not accidentally treat local run instances as tracked source-of-truth.
    - path: "docs/runs/_template/**/*.md"
      instructions: |
        Review these as tracked templates only. Ensure they support fresh-session execution, exact verification, and durable task structure without assuming local-only artifacts are tracked.
    - path: ".agents/skills/**/*.md"
      instructions: |
        These are repo-local Lineup skills. Review for overlap with global Codex skills, contradictions with AGENTS.md or docs/agentic/*, and anything that would weaken architectural boundaries, persistence discipline, Plex integration boundaries, or UI composition rules.
    - path: "tools/verify-docs.mjs"
      instructions: |
        Review this small structural checker against repo policy. It should validate required tracked entrypoints, local links, skill metadata, role config/read-only safety, and minimal active-plan structure without enforcing prose, inventories, or duplicated workflow policy.
    - path: "src/Orchestrator.ts"
      instructions: |
        Treat this as a hotspot. Prefer comments that reduce responsibility growth, preserve clear composition-root ownership, and push work toward focused collaborators. Flag changes that increase cross-cutting orchestration logic or rely on private-probe-friendly design.
    - path: "src/App.ts"
      instructions: |
        Treat this as an app-shell hotspot. Flag changes that mix startup orchestration with feature-specific UI/runtime policy, duplicate lazy-screen ownership, or weaken cleanup/timer/listener ownership.
    - path: "src/modules/ui/**/*.ts"
      instructions: |
        Review UI changes for focus ownership, timer/listener cleanup, hidden-UI cleanup, and TV/D-pad behavior. Flag screen or overlay changes that keep async work alive after hide, collapse state/render/input ownership, or bypass repo UI composition guidance.
    - path: "src/modules/plex/**/*.ts"
      instructions: |
        Review Plex changes for policy leakage. Subtitle, auth, discovery, transport, URL construction, and stream policy must stay inside Plex-facing modules rather than spreading into UI or orchestration callers.
    - path: "src/**/*.css"
      instructions: |
        Review CSS for Lineup's TV-first design system discipline. Prefer existing tokens, shared shells, and component-owned class namespaces. Flag one-off color/spacing systems, duplicated theme values, fragile z-index/focus styling, expensive effects for webOS, and changes that weaken readable focus/remote-control states. Do not request cosmetic churn when the diff follows existing local patterns.
    - path: "docs/design/**"
      instructions: |
        Review design docs as source-of-truth guidance. Flag contradictions with current CSS/component practice, token drift, stale UI claims, or advice that would encourage one-off styling instead of the established Lineup design language.
    - path: "src/platform/**"
      instructions: |
        Review platform changes for explicit ownership of webOS and browser/Electron-like assumptions. Flag platform checks, user-agent parsing, lifecycle hooks, Plex headers, or capability detection that leak into generic modules or make future Windows portability harder without a clear contract.
    - path: "src/bootstrap.ts"
      instructions: |
        Review bootstrap changes for startup/lifecycle ownership, global listener cleanup, DOM readiness, and platform assumptions. Flag feature-specific policy, long-lived async work, or webOS/browser behavior hidden in bootstrap instead of an owned service.
    - path: "src/modules/lifecycle/**/*.ts"
      instructions: |
        Review lifecycle changes for explicit pause/resume/relaunch/network/memory semantics and cleanup. Flag assumptions that are webOS-only but not named as such, or portability changes that bypass the platform service boundary.
    - path: "src/modules/player/**/*.ts"
      instructions: |
        Review player changes for media lifecycle cleanup, subtitle/audio ownership, webOS playback quirks, fullscreen/visibility behavior, and portability assumptions. Flag fixes that move Plex stream policy or platform detection into UI/player callers without an explicit boundary.
    - path: "src/modules/plex/stream/**/*.ts"
      instructions: |
        Review stream-resolution changes for Plex policy ownership, codec/container capability handling, URL construction, mixed-content behavior, and platform-specific playback decisions. Flag Windows-port assumptions or webOS rules that are implicit, duplicated, or placed outside the stream policy boundary.
    - path: "src/core/server-selection/**/*.ts"
      instructions: |
        Review server-selection changes for persistence ownership, startup handoff clarity, and platform-neutral contracts. Flag raw storage access, broad result objects leaking into callers, or UI/app-shell code taking over server-selection decisions.
    - path: "src/modules/scheduler/**/*.ts"
      instructions: |
        Review scheduler changes for channel persistence ownership, deterministic schedule behavior, time-window edge cases, and portable runtime assumptions. Flag direct storage or platform coupling outside the established scheduler/channel-manager boundaries.
    - path: "src/**/*.test.ts"
      instructions: |
        Review tests for behavior and contract coverage rather than private-probe coupling. Prefer realistic fixtures, clear regression intent, deterministic async/timer handling, and verification of public seams. Flag brittle tests that mirror implementation details, weaken failure-path coverage, or omit tests for changed persistence, navigation, Plex, scheduler, startup, or platform contracts.
    - path: "src/**/__tests__/**/*.ts"
      instructions: |
        Review test helpers and fixtures for realistic contracts, maintainability, and low coupling to private implementation details. Flag helper changes that hide behavior assertions, make async/timer behavior nondeterministic, or weaken coverage of persistence, navigation, Plex, scheduler, startup, or platform seams.
    - path: "tools/__tests__/**"
      instructions: |
        Review tooling tests for stable executable behavior. Add regression coverage only when a tooling failure mode is important and likely to recur; avoid mirrors of prose or file inventories.
    - path: "src/**/*.ts"
      instructions: |
        For storage-backed changes, flag new raw localStorage access in feature modules and push toward centralized persistence owners/stores. For shared-symbol edits, expect impact-aware reasoning and verification proportional to risk.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/AGENTIC_DEV_WORKFLOW.md"
      - "docs/architecture/CURRENT_STATE.md"
      - "ARCHITECTURE_CLEANUP_CHECKLIST.md"
      - "docs/design/ui-design-language.md"
      - "docs/design/css-governance.md"
      - "docs/api/plex-integration.md"
